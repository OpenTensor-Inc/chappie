[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chappie"
version = "1.0.0"
description = "Chappie v1: CLEFPE field language model — 3D PDE dynamics instead of Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "jax>=0.4",
  "jaxlib>=0.4",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
viz = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["chappie*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
